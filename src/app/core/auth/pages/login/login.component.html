<form class="login__form" [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field class="w-100 mb-16">
    <mat-label>Usuario</mat-label>
    <input matInput placeholder="Digite o usuário" formControlName="user" required />

    @if (form.controls.user.hasError('required')) {
      <mat-error>Campo obrigatório.</mat-error>
    }
  </mat-form-field>

  <mat-form-field class="w-100 mb-16">
    <mat-label>Senha</mat-label>
    <input
      matInput
      type="password"
      placeholder="Digite a senha"
      formControlName="password"
      required
    />

    @if (form.controls.password.hasError('required')) {
      <mat-error>Campo obrigatório.</mat-error>
    }
  </mat-form-field>

  @if (form.hasError('wrongCredentials')) {
    <mat-error>Usuário ou senha está icorreto.</mat-error>
  }

  <div class="login__submit">
    <button type="submit" mat-flat-button="filled" [disabled]="form.invalid">Entrar</button>
  </div>
</form>
